name: Deploy to VPS

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure SSH key permissions
        run: mkdir -p ~/.ssh && echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa && chmod 600 ~/.ssh/id_rsa

      - name: Add host to known_hosts
        run: ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to VPS (git pull + docker compose)
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          script: |
            set -e
            # clone if missing
            if [ ! -d /opt/jobpilot ]; then
              git clone https://github.com/${{ github.repository }} /opt/jobpilot
            fi
            cd /opt/jobpilot
            git fetch --all
            git reset --hard $GITHUB_SHA
            # ensure .env exists (create from template if missing)
            if [ ! -f .env ]; then
              cp .env.production.example .env
              echo "Please edit /opt/jobpilot/.env with secrets"
            fi
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull || true
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build --remove-orphans
