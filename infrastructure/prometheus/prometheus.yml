# ============================================================
# JobPilot — Prometheus Configuration
# ============================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  # --- FastAPI Backend ---
  - job_name: "jobpilot-backend"
    static_configs:
      - targets: ["backend:8000"]
    metrics_path: /metrics
    scrape_interval: 10s

  # --- Prometheus Self ---
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # --- n8n (if metrics enabled) ---
  - job_name: "n8n"
    static_configs:
      - targets: ["n8n:5678"]
    metrics_path: /metrics
    scrape_interval: 30s
